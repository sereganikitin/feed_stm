# feeds.infoseledka.ru — ФАЗА 2: HTTP→HTTPS + проксирование на контейнер feed-enricher:8765.
# Добавляется в st-michael-nginx через docker-compose.override.yml как conf.d/feeds.conf.
# НЕ редактировать /opt/st-michael-broker-platform/docker/nginx.conf — он git-tracked.

server {
    listen 80;
    server_name feeds.infoseledka.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name feeds.infoseledka.ru;

    ssl_certificate     /etc/letsencrypt/live/feeds.infoseledka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feeds.infoseledka.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    # для автопродления сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://feed-enricher:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
